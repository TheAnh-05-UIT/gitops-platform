<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <title>Developer Portal</title>
  </head>
  <body>
    <main>
      <h1>Cập nhật workload-api</h1>

      {% if error %}
      <p role="alert">{{ error }}</p>
      {% endif %}

      {% if notice %}
      <p>{{ notice }}</p>
      {% endif %}

      {% if pull_request %}
      <p>
        Đã tạo
        <a href="{{ pull_request.html_url }}">PR #{{ pull_request.number }}</a>.
        Mở PR để xem kết quả kiểm tra.
      </p>
      {% endif %}

      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="replicas">Số replica mong muốn</label>
        <input id="replicas" name="replicas" type="number"
               min="1" max="3" value="2" required>
        <button type="submit">Tạo PR</button>
      </form>
    </main>
  </body>
</html>
