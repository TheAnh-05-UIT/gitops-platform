---
- name: Require an exact K3s version and approved per-architecture digest
  ansible.builtin.assert:
    that:
      - k3s_release is defined
      - k3s_release is match('^v1\.[0-9]+\.[0-9]+\+k3s[1-9][0-9]*$')
      - k3s_sha256 is defined
      - k3s_sha256[ansible_facts.architecture] is defined
      - k3s_sha256[ansible_facts.architecture] is match('^[0-9a-f]{64}$')

- name: Check for an unmanaged K3s installation
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /etc/systemd/system/k3s.service
    - /etc/systemd/system/k3s-agent.service
    - /var/lib/rancher/k3s
  register: k3s_install_paths

- name: Inspect the lab ownership marker
  ansible.builtin.stat:
    path: /etc/rancher/k3s/.gitops-platform
  register: k3s_managed_marker

- name: Reject an unmanaged K3s installation
  ansible.builtin.assert:
    that:
      - k3s_managed_marker.stat.exists or not (k3s_install_paths.results | selectattr('stat.exists') | list)
    fail_msg: Existing K3s must be reviewed before it can be adopted.

- name: Read the lab ownership marker
  ansible.builtin.slurp:
    src: /etc/rancher/k3s/.gitops-platform
  register: k3s_owner
  when: k3s_managed_marker.stat.exists

- name: Verify ownership of an existing installation
  ansible.builtin.assert:
    that:
      - "(k3s_owner.content | b64decode | trim) == lab_environment + ':' + k3s_mode"
  when: k3s_managed_marker.stat.exists

- name: Prepare root-owned lab directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - /etc/rancher/k3s
    - /usr/local/libexec/gitops-platform-k3s

- name: Record ownership before managing lab service files
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/.gitops-platform
    content: "{{ lab_environment }}:{{ k3s_mode }}\n"
    mode: "0600"

- name: Derive the immutable binary path
  ansible.builtin.set_fact:
    k3s_binary: "/usr/local/libexec/gitops-platform-k3s/k3s-{{ k3s_release }}"

- name: Download and verify the pinned upstream release asset
  ansible.builtin.get_url:
    url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_release | urlencode }}/{{ 'k3s-arm64' if ansible_facts.architecture == 'aarch64' else 'k3s' }}"
    checksum: "sha256:{{ k3s_sha256[ansible_facts.architecture] }}"
    dest: "{{ k3s_binary }}"
    owner: root
    group: root
    mode: "0755"
    timeout: 60
  notify: Restart K3s

- name: Install the lab-owned systemd service unit
  ansible.builtin.template:
    src: ../templates/k3s.service.j2
    dest: "/etc/systemd/system/{{ k3s_unit }}.service"
    mode: "0644"
  notify: Restart K3s
